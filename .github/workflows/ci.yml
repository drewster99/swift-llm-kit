name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15 carries the oldest Swift 6 toolchain we promise to build with; macos-26 carries
        # the newest. Language-level behaviour differs between them (e.g. exhaustiveness checking
        # of `true`/`false`/`nil` patterns over `Bool?`), so both must stay green.
        runner: [macos-15, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: swift --version
        run: swift --version

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel
